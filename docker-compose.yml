services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbbapp
      POSTGRES_PASSWORD: tbbapp_dev_password
      POSTGRES_DB: tbbapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbbapp -d tbbapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PostgreSQL 17 for the Laravel app (laravel/). Separate service + volume so the
  # Node app's postgres:16 data above stays untouched.
  db17:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbbapp
      POSTGRES_PASSWORD: tbbapp_dev_password
      POSTGRES_DB: tbbapp
    ports:
      - "5434:5432"
    volumes:
      - pgdata17:/var/lib/postgresql/data
      - ./docker/postgres17-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbbapp -d tbbapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tbbapp.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  pgdata17:
  pgadmin_data:
