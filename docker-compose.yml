services:
  # PostgreSQL 17 for the Laravel app. Host port 5434 so it can coexist with a
  # native PostgreSQL install on the default 5432 — set DB_PORT to match
  # whichever you actually use. The init script creates the test database, but
  # only on the first initialization of the pgdata17 volume.
  db17:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbbapp
      POSTGRES_PASSWORD: tbbapp_dev_password
      POSTGRES_DB: tbbapp
    ports:
      - "5434:5432"
    volumes:
      - pgdata17:/var/lib/postgresql/data
      - ./docker/postgres17-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbbapp -d tbbapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Inspection client only — ALL schema changes go through migrations.
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tbbapp.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db17
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata17:
  pgadmin_data:
