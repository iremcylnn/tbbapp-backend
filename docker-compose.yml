services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbbapp
      POSTGRES_PASSWORD: tbbapp_dev_password
      POSTGRES_DB: tbbapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbbapp -d tbbapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
