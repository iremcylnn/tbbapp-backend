name: Laravel CI

# Separate workflow from the Node app's ci.yml: path filtering keeps each
# stack's pipeline from running on the other's changes.
on:
  push:
    branches: [master]
    paths: ['laravel/**', '.github/workflows/laravel-ci.yml']
  pull_request:
    branches: [master]
    paths: ['laravel/**', '.github/workflows/laravel-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: laravel

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tbbapp
          POSTGRES_PASSWORD: tbbapp_dev_password
          POSTGRES_DB: tbbapp_laravel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbbapp -d tbbapp_laravel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrations smoke test
        run: php artisan migrate --force
        env:
          DB_DATABASE: tbbapp_laravel_test

      - name: Run tests
        run: php artisan test
