name: CI (legacy Node app)

on:
  push:
    branches: [master]
    paths: ['node-old/**']
  pull_request:
    branches: [master]
    paths: ['node-old/**']

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: node-old

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tbbapp
          POSTGRES_PASSWORD: tbbapp_dev_password
          POSTGRES_DB: tbbapp
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tbbapp -d tbbapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tbbapp:tbbapp_dev_password@localhost:5433/tbbapp
      ADMIN_API_KEY: ci-admin-key
      JWT_SECRET: ci-jwt-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: node-old/package-lock.json

      - run: npm ci

      - name: Prisma client + migrations + seed
        run: |
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed.js

      - run: npm test
